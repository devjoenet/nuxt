name: larascan security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for repo.gitleaks-history

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Prepare application environment
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=production/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' \
            -e 's/^SESSION_ENCRYPT=.*/SESSION_ENCRYPT=true/' \
            -e 's/^SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=true/' \
            -e 's/^LOG_LEVEL=.*/LOG_LEVEL=warning/' \
            .env
          touch database/database.sqlite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        if: hashFiles('package.json') != ''

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Boot application for scan
        run: |
          php -d expose_php=0 -d allow_url_fopen=0 -d display_errors=0 artisan key:generate --force --no-interaction
          php -d expose_php=0 -d allow_url_fopen=0 -d display_errors=0 artisan migrate --force --no-interaction

      - name: Run larascan
        # Very large apps may need more memory than the PHP CLI default; larascan
        # raises a 512M floor itself, but for big monorepos prepend `-d memory_limit=-1`:
        #   run: php -d memory_limit=-1 artisan larascan ...
        run: php -d expose_php=0 -d allow_url_fopen=0 -d display_errors=0 artisan larascan --fail-on=high --only-failed --format=sarif --output=larascan.sarif --no-interaction

      - name: Upload SARIF to GitHub Code Scanning
        # Requires GitHub Advanced Security on private repos; remove this step if unavailable.
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('larascan.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: larascan.sarif
          category: larascan
