name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      XDEBUG_MODE: off
      COMPOSER_AUTH: ${{ secrets.MODULES_COMPOSER_AUTH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Yarn Cache
        uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install Node Dependencies
        run: yarn install --immutable

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit production Node dependencies
        run: yarn audit:production
        env:
          YARN_NPM_AUDIT_REGISTRY: https://registry.npmjs.org
          YARN_HTTP_TIMEOUT: 180000

      - name: Audit full Node dependency tree
        if: github.event_name == 'push'
        run: yarn audit:full
        env:
          YARN_NPM_AUDIT_REGISTRY: https://registry.npmjs.org
          YARN_HTTP_TIMEOUT: 180000
        continue-on-error: true

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps --only-shell chromium

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Prepare SQLite Database
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build Assets
        run: yarn build

      - name: Lint Frontend
        run: yarn lint:check

      - name: Type Check Frontend
        run: yarn typecheck

      - name: Rector Cache
        uses: actions/cache@v5
        with:
          path: /tmp/rector_cached_files
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}-${{ hashFiles('app/**/*.php', 'bootstrap/**/*.php', 'config/**/*.php', 'database/**/*.php', 'rector.php') }}
          restore-keys: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}-

      - name: PHPStan Cache
        uses: actions/cache@v5
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}-${{ hashFiles('app/**/*.php', 'bootstrap/**/*.php', 'config/**/*.php', 'database/**/*.php', 'routes/**/*.php', 'tests/**/*.php', 'phpstan*.neon') }}
          restore-keys: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}-
      - run: mkdir -p /tmp/phpstan

      - name: Type Coverage
        run: composer test:type-coverage

      - name: Unit and Feature Tests
        run: composer test:unit
        env:
          XDEBUG_MODE: coverage

      - name: Browser Tests
        timeout-minutes: 10
        run: composer test:browser -- --log-junit storage/logs/browser-junit.xml

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            tests/Browser/Screenshots
            storage/logs/browser-junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: PHP Code Style
        run: composer test:lint

      - name: PHPStan
        run: composer test:types

      - name: PHPStan Max
        run: composer test:types:max
